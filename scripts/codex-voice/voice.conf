# codex-voice voice settings, read by the codex-voice launcher at each start.
# `codex-voice models` lists the models and voices available on this Mac.
# Environment variables override these for one run, e.g.
#   CODEX_VOICE_TTS=local-models codex-voice

# Text to speech:
#   say           macOS speech (the default)
#   kokoro        Kokoro kept loaded by a helper server for the session: a
#                 natural voice, a sentence in under a second. The first start
#                 downloads its packages and the model.
#   local-models  a speech model from the local-models MCP gateway
#                 (local-agents' mcp_server.py), e.g. Kokoro or Chatterbox.
#                 Slower: about 7 s per sentence once warm, up to 90 s cold.
tts = say
say_voice =                  # empty: the system voice. `say -v '?'` lists them.
tts_model = hf:mlx-community/Kokoro-82M-8bit
tts_voice = af_heart         # Kokoro voice: af_/am_ American, bf_/bm_ British, hf_/hm_ Hindi

# Speech to text:
#   whisper-server  Whisper kept loaded by a helper server (fastest, the default)
#   mlx_whisper     the mlx_whisper command, loading the model per utterance
#   local-models    a transcription model from the local-models MCP gateway
stt = whisper-server
stt_model = mlx-community/whisper-large-v3-turbo
language = en

# The local-models MCP gateway.
mcp_url = http://127.0.0.1:5051/mcp
